# Builds the app for macOS and Windows, and turns a tag into a release.
#
# Split into two jobs on purpose:
#
# - `check` runs on every push and pull request. It is the whole suite plus the
#   typecheck, on Linux, because none of it needs Electron or a desktop — see
#   the tests are written to need neither. Cheap enough to
#   run on everything.
# - `build` produces the actual artefacts. It is gated by an `if` rather than by
#   the trigger, because the trigger has to stay open for `check` — the two jobs
#   want different events. macOS runners bill at ten times the Linux rate, so
#   building both platforms on every push would spend a free account's monthly
#   minutes in a couple of days. To have that anyway, delete the `if:` on the
#   build job and accept the bill.
#
# Where the artefacts end up depends on why the run happened:
#
# - On a **tag**, each job attaches its own files to the GitHub release for that
#   tag. Release assets do not count against the Actions artifact quota, which
#   is not a detail: the first tagged run failed at exactly that quota with both
#   platforms already built. They also outlive the 30-day retention an Actions
#   artifact gets, which is what you want from a release anyway.
#
#   The upload is `softprops/action-gh-release`, not electron-builder's own
#   `--publish`. That was tried first and consistently produced *two* releases
#   for one tag, with the assets split between them — as a draft (no tag to find
#   it by) and as a prerelease (a real tag, and it still made a second one),
#   with the platforms building strictly one after the other. This action looks
#   the release up by tag and adds to it, which is the behaviour that was
#   wanted.
# - On a **manual run**, there is no release to publish to, so the files go to
#   Actions artifacts instead. That upload is allowed to fail without failing
#   the run — a manual run is asking "does it still build", and the answer to
#   that is the packaging step, not the upload.
#
# macOS is signed with a Developer ID certificate, imported from the secrets on
# the Package step. That is a requirement rather than a polish: Squirrel.Mac
# validates the signature of every update before installing it, so an unsigned
# macOS build cannot update itself at all.
#
# It is signed but **not notarized**, so Gatekeeper still wants right-click →
# Open on the first launch — notarization is a separate step with its own
# credentials. Windows has no certificate at all and SmartScreen still wants
# "More info" → "Run anyway"; its updater does not check signatures
# (`verifyUpdateCodeSignature: false`), so updating works regardless.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref. A second push to the same branch cancels the first rather
# than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The version macOS development used. Windows ran fine on 24 as well, but CI
  # pins one so a green run means the same thing every time.
  NODE_VERSION: '22'

jobs:
  check:
    name: tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Not part of `npm test`: it is what `npm run build` does first, and a type
      # error should fail here rather than three minutes into a packaging run.
      - run: npm run typecheck

      - run: npm test

  build:
    name: ${{ matrix.name }}
    # A tag or a deliberate click — not every push and not every pull request.
    # See the note at the top of the file for what this costs if removed.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      # electron-builder creates and fills the draft release itself.
      contents: write
    strategy:
      # One platform failing should not hide whether the other one worked.
      fail-fast: false
      # One at a time: the first job to finish creates the release, the second
      # adds to it. Concurrently, both would be creating it at once.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64)
            script: package:mac
            artifact: factorial-desktop-macos
          - os: windows-latest
            name: Windows (x64)
            script: package:win
            artifact: factorial-desktop-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Package
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # The macOS signing certificate, as a base64 `.p12`, and its password.
          # Not a nicety: Squirrel.Mac validates the signature of every update
          # before installing it, so an unsigned build cannot update itself. See
          # the `mac:` block in electron-builder.yml for the whole story.
          #
          # Only the values are secret. GitHub decrypts them into this step for
          # the length of the run and masks them in the log; there is no API that
          # reads them back. Fork pull requests never get them, and this job does
          # not run on pull requests at all — see the `if:` above.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          # Without a certificate, electron-builder would hunt the keychain and
          # fail on finding nothing. This keeps a run without the secret — a
          # manual build, a fork — working, unsigned, instead of breaking.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        # Pinned to a commit rather than a moving tag: this action runs in the
        # same job as the signing certificate, so whoever controls the tag would
        # control a step that can read it. (= v2, 2026-08)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          # Not win-unpacked/ or mac/: the same app again as loose files.
          #
          # `latest*.yml` is not optional — it is the feed the installed app
          # reads to learn a new version exists. Without it every update check
          # fails with a 404 and the whole updater is decoration. The blockmaps
          # go with it: electron-updater uses them to download only the changed
          # parts of an installer, and falls back to the full file when they are
          # missing.
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/latest*.yml
            release/*.blockmap
          fail_on_unmatched_files: false
          # A plain release. What is and is not signed belongs in the notes,
          # which people read, rather than in a flag nobody sees.
          generate_release_notes: true
          body: |
            Unsigned builds — the first launch needs one extra step.

            - **Windows:** `Factorial-Desktop-Setup-<version>.exe` installs for
              the current user (Start-menu entry, uninstaller, optional
              start-with-Windows). `Factorial-Desktop.exe` runs without
              installing. SmartScreen: *More info* → *Run anyway*.
            - **macOS:** `.dmg` or `.zip`, Apple Silicon. Right-click → *Open*
              on first launch, or Gatekeeper refuses it.

            The installed build updates itself: it checks for new versions and
            asks before downloading, and never restarts while a shift is
            running.

      - name: Collect artefacts
        # Only where there is no release to publish to. See the note at the top.
        if: github.event_name == 'workflow_dispatch'
        # The quota is an account-wide limit that a green build cannot do
        # anything about, and failing the run over it would report "the build is
        # broken" for something that built fine.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # The installers, the portable exe and the mac archives — but not
          # win-unpacked/ or mac/, which are the same app again as loose files
          # and would multiply the upload for nothing.
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7

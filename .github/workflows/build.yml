# Builds the app for macOS and Windows, and turns a tag into a release.
#
# Split into two jobs on purpose:
#
# - `check` runs on every push and pull request. It is the whole suite plus the
#   typecheck, on Linux, because none of it needs Electron or a desktop — see
#   docs/WINDOWS.md §1 on why the tests are written that way. Cheap enough to
#   run on everything.
# - `build` produces the actual artefacts. It is gated by an `if` rather than by
#   the trigger, because the trigger has to stay open for `check` — the two jobs
#   want different events. macOS runners bill at ten times the Linux rate, so
#   building both platforms on every push would spend a free account's monthly
#   minutes in a couple of days. To have that anyway, delete the `if:` on the
#   build job and accept the bill.
#
# Where the artefacts end up depends on why the run happened:
#
# - On a **tag**, electron-builder uploads them straight to a draft GitHub
#   release. Release assets do not count against the Actions artifact quota,
#   which is not a detail: the first tagged run failed at exactly that quota
#   with both platforms already built. They also outlive the 30-day retention
#   an Actions artifact gets, which is what you want from a release anyway.
# - On a **manual run**, there is no release to publish to, so the files go to
#   Actions artifacts instead. That upload is allowed to fail without failing
#   the run — a manual run is asking "does it still build", and the answer to
#   that is the packaging step, not the upload.
#
# Neither platform is code-signed: `identity: null` in electron-builder.yml for
# macOS, and no certificate for Windows. The artefacts therefore carry the usual
# warnings — Gatekeeper wants right-click → Open on the first launch, SmartScreen
# wants "More info" → "Run anyway". Signing is a paid certificate and a secret,
# and neither exists yet.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per ref. A second push to the same branch cancels the first rather
# than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The version macOS development used. Windows ran fine on 24 as well, but CI
  # pins one so a green run means the same thing every time.
  NODE_VERSION: '22'

jobs:
  check:
    name: tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Not part of `npm test`: it is what `npm run build` does first, and a type
      # error should fail here rather than three minutes into a packaging run.
      - run: npm run typecheck

      # Includes handoff-docs.test.ts, which fails when docs/WINDOWS.md and the
      # platform markers in the source have drifted apart.
      - run: npm test

  build:
    name: ${{ matrix.name }}
    # A tag or a deliberate click — not every push and not every pull request.
    # See the note at the top of the file for what this costs if removed.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      # electron-builder creates and fills the draft release itself.
      contents: write
    strategy:
      # One platform failing should not hide whether the other one worked.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (arm64)
            script: package:mac
            artifact: factorial-desktop-macos
          - os: windows-latest
            name: Windows (x64)
            script: package:win
            artifact: factorial-desktop-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Package and publish
        # `always` on a tag: build, then attach to the draft release. Both
        # platforms publish into the same release — electron-builder creates it
        # on the first one and adds to it on the second.
        run: npm run ${{ matrix.script }} -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          # Without this electron-builder hunts the keychain for a signing
          # identity and fails the build when it finds none. `identity: null`
          # already says not to sign; this stops the search itself.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect artefacts
        # Only where there is no release to publish to. See the note at the top.
        if: github.event_name == 'workflow_dispatch'
        # The quota is an account-wide limit that a green build cannot do
        # anything about, and failing the run over it would report "the build is
        # broken" for something that built fine.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          # The installers, the portable exe and the mac archives — but not
          # win-unpacked/ or mac/, which are the same app again as loose files
          # and would multiply the upload for nothing.
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7

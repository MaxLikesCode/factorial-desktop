appId: com.maxgiess.factorial-desktop
productName: Factorial Desktop
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  # Not optional: src/main/tray.ts resolves its icons as
  # `import.meta.dirname/../../resources`, i.e. from inside the asar.
  - resources/**/*
  - package.json

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # No signing identity: the app is unsigned by choice for now.
  identity: null
  # LSUIElement hides the dock icon — this is a menubar app.
  extendInfo:
    LSUIElement: 1

# PLATFORM: verified on Windows 11 on 2026-08-20 — see docs/WINDOWS.md §4a.
# The installer builds, installs without admin rights, and the Run-key entry it
# leads to points at the installed .exe. The icon sizes were never a problem.
win:
  target:
    # The installer: a Start-menu entry, an uninstaller, and the path the
    # autostart entry can safely point at.
    - target: nsis
      arch: [x64]
    # And the same app as a single file that runs from wherever it is dropped.
    # It writes to the same %APPDATA%\factorial-desktop as the installed build,
    # so a session and its settings survive a switch between the two — but the
    # autostart entry would point at wherever the file happened to sit, which is
    # why the installer stays the way to get a login item worth having.
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  # Without this the file is called "Factorial Desktop 0.1.0.exe" and the
  # version travels into every shortcut somebody makes of it.
  artifactName: ${productName}.${ext}

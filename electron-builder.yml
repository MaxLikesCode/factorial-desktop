appId: com.maxgiess.factorial-desktop
productName: Factorial Desktop
# Not an upload target — the CI attaches the files itself (see the workflow).
# This is here because electron-builder turns it into `app-update.yml` inside
# the package, and that file is the only way the running app knows where to look
# for a new version. Without it electron-updater has no feed and fails at
# startup with "provider is not specified".
publish:
  provider: github
  owner: MaxLikesCode
  repo: factorial-desktop
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  # Not optional: src/main/tray.ts resolves its icons as
  # `import.meta.dirname/../../resources`, i.e. from inside the asar.
  - resources/**/*
  - package.json

# The names of the artefacts, spelled out rather than built from
# `${productName}` — because that name contains a space, and a space is spelled
# differently by everyone who touches it. electron-builder would write
# `Factorial Desktop-0.2.1-arm64-mac.zip` into release/; GitHub turns the space
# into a *dot* when the workflow uploads the file; and `latest*.yml`, which is
# the only name the updater ever asks for, carries electron-builder's own
# space-free form with a *dash*. Three names for one file, and the update dies
# on a 404 — which is how v0.2.1 shipped. Keeping the space out entirely makes
# the file, the release asset and the feed entry the same string.
#
# The dashed spelling matches what the feed already used, so it is also what the
# release notes in .github/workflows/build.yml tell people to download.
mac:
  # Applies to the zip; the dmg gets its own name below. Both mirror
  # electron-builder's defaults, only without the space.
  artifactName: Factorial-Desktop-${version}-${arch}-mac.${ext}
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  # No signing identity: the app is unsigned by choice for now.
  identity: null
  # LSUIElement hides the dock icon — this is a menubar app.
  extendInfo:
    LSUIElement: 1

dmg:
  # Target-specific config wins over the `mac` block above; the dmg is the one
  # macOS artefact whose default name carries no `-mac` suffix.
  artifactName: Factorial-Desktop-${version}-${arch}.${ext}

# PLATFORM: the signature check exists only on Windows.
# The installer builds, installs without admin rights, and the Run-key entry it
# leads to points at the installed .exe. The icon sizes were never a problem.
win:
  # PLATFORM: the signature check exists only on Windows.
  # The builds are unsigned, and electron-updater checks the signature of what
  # it downloaded against the running app's publisher before installing it. With
  # nothing to compare, that check fails and the update never applies — so it is
  # turned off explicitly rather than left to fail at the last step. Turn it back
  # on the day there is a certificate; leaving it off with one would defeat the
  # point of having it.
  verifyUpdateCodeSignature: false
  target:
    # The installer: a Start-menu entry, an uninstaller, and the path the
    # autostart entry can safely point at.
    - target: nsis
      arch: [x64]
    # And the same app as a single file that runs from wherever it is dropped.
    # It writes to the same %APPDATA%\factorial-desktop as the installed build,
    # so a session and its settings survive a switch between the two — but the
    # autostart entry would point at wherever the file happened to sit, which is
    # why the installer stays the way to get a login item worth having.
    - target: portable
      arch: [x64]
nsis:
  artifactName: Factorial-Desktop-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
portable:
  # Without this the file is called "Factorial Desktop 0.1.0.exe" and the
  # version travels into every shortcut somebody makes of it. Spelled out for
  # the same reason as the others: "Factorial Desktop.exe" reached the release
  # as "Factorial.Desktop.exe".
  artifactName: Factorial-Desktop.${ext}
